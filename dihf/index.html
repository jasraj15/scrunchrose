<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCRUNCHROSE — Made with love</title>
<meta name="description" content="Scrunchies folded into roses, wrapped in stories, made to be kept close.">
<meta name="theme-color" content="#401321"><meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ivory:#F6EFE4;--cream:#FFF9F1;--wine:#6E1F3A;--velvet:#401321;--rose:#D9A5A8;--blush:#F0D5D5;--sage:#9AA88C;--ink:#3B2A2A;--brass:#B08D57;--line:rgba(110,31,58,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--ivory);color:var(--ink);font:400 16px/1.65 'DM Sans',system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.02;margin:0}
h2{font-size:clamp(2.1rem,5.4vw,3.8rem)}
a{color:inherit}button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
section{padding:90px 0}
.ivory{background:var(--ivory)}.blush{background:var(--blush)}.sage{background:var(--sage)}.wine{background:var(--velvet);color:var(--blush)}.cream{background:var(--cream)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(246,239,228,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:66px}
.mark{font-family:'Pinyon Script',cursive;font-size:2rem;text-decoration:none;color:var(--wine)}
nav a{margin-right:22px;text-decoration:none;font-size:.92rem}
.bag{background:none;border:1px solid var(--wine);border-radius:99px;padding:8px 16px}
.btn{display:inline-block;background:var(--wine);color:#fff;border:0;padding:14px 26px;text-decoration:none;letter-spacing:.05em;transition:background .2s,transform .2s}
.btn:hover{background:var(--velvet);transform:translateY(-2px)}
.btn.ghost{background:none;color:inherit;border:1px solid currentColor}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;min-height:calc(100svh - 66px);padding:30px 0}
.hero h1{font-size:clamp(2.7rem,7vw,5.4rem);color:var(--wine)}
.hero p{max-width:36ch}
.frame{border:1px solid var(--wine);padding:10px;background:var(--cream);box-shadow:0 30px 50px rgba(64,19,33,.22)}
.frame img{display:block;width:100%;height:auto}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.35rem;margin:.6rem 0 32px}
.feel{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.feel button{background:none;border:1px solid var(--wine);padding:10px 18px;border-radius:99px}
.feel button[aria-pressed=true]{background:var(--wine);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:30px}
.card{background:var(--cream);border:1px solid var(--line);padding:12px}
.card a.im{display:block;overflow:hidden}.card img{display:block;width:100%;height:auto;transition:transform .6s}.card:hover img{transform:scale(1.05)}
.card h3{font-size:1.7rem;margin-top:12px}.meta{font-size:.85rem;opacity:.75}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);display:inline-block;vertical-align:middle}
.act{display:flex;gap:8px;margin-top:12px}.act>*{flex:1;text-align:center;padding:10px;border:1px solid var(--wine);background:none;text-decoration:none;font-size:.9rem}
.act .p{background:var(--wine);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.zoom{cursor:zoom-in;border:0;padding:0;background:none;display:block;width:100%}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px;padding:0;margin:36px 0 0;list-style:none}
.steps li{border-top:2px solid var(--wine);padding-top:14px}.steps h3{font-size:1.5rem}
.sig{font-family:'Pinyon Script',cursive;font-size:2.2rem;margin:0;color:var(--wine)}
.note{font-size:.8rem;opacity:.75}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f label{display:block;font-size:.88rem}.f .w{grid-column:1/-1}
.f input{width:100%;padding:12px;border:1px solid var(--line);background:#fff;font:inherit}
.f input[aria-invalid=true]{border-color:#a3162a}.err{color:#a3162a;font-size:.8rem;min-height:1.2em}
.sum{background:var(--cream);border:1px solid var(--line);padding:22px}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.b{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:600}
footer{background:var(--velvet);color:var(--blush);padding:56px 0 34px;font-size:.9rem}
footer .cols{display:flex;gap:40px;flex-wrap:wrap;justify-content:space-between}footer a{display:block;text-decoration:none;margin:4px 0}
#drawer{position:fixed;inset:0 0 0 auto;width:min(430px,100%);background:var(--ivory);z-index:60;transform:translateX(100%);transition:transform .35s;display:flex;flex-direction:column;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(40,10,20,.5);z-index:50;display:none}#scrim.open{display:block}
#items{flex:1;overflow:auto}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li img{width:64px;height:52px;object-fit:cover}.li>div{flex:1}
.q button{width:28px;height:28px;border:1px solid var(--line);background:none}
#lb{position:fixed;inset:0;z-index:70;background:rgba(30,8,16,.92);display:none;overflow:auto;padding:20px;cursor:zoom-out}#lb.open{display:block}#lb img{display:block;max-width:min(900px,100%);height:auto;margin:auto}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at center,#5a1a30 0%,#2a0b15 70%);color:#F6EFE4;display:grid;place-items:center;text-align:center;transition:opacity 1.1s}
#intro canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#itext{position:relative;z-index:2;pointer-events:none;margin-top:36vh}
#itext>*{opacity:0;transition:opacity 1.2s,letter-spacing 2.4s;margin:0}
#itext .n{font:500 clamp(2.2rem,8vw,5rem) 'Cormorant Garamond',serif;letter-spacing:.1em}
#itext .n.on{letter-spacing:.34em}#itext .m{font:italic 500 clamp(1.1rem,3vw,1.7rem) 'Cormorant Garamond',serif;letter-spacing:.3em;margin-top:6px}
#itext .by{font:.8rem 'DM Sans';letter-spacing:.4em;margin-top:12px;color:var(--rose)}
#itext .on{opacity:1}
#skip{position:absolute;z-index:3;right:20px;top:calc(18px + env(safe-area-inset-top,0px));background:none;border:1px solid var(--rose);color:var(--blush);padding:8px 16px}
.hide{opacity:0;pointer-events:none}
@media(max-width:760px){.hero,.two{grid-template-columns:1fr}.two{gap:30px}nav{display:none}section{padding:60px 0}form.f{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>

const cardFig=()=>`<button class="zoom" data-zoom aria-label="Enlarge packaging concept"><div class="frame"><img loading="lazy" src="${CARD}" width="853" height="1280" alt="Packaging concept: front and back of the botanical letter card with a burgundy rose-shaped scrunchie, ribbon and care details"></div></button><p class="note">Packaging concept mockup (front and back). It shows the placeholder name “Petalpost” and sample details; it will be replaced with the final SCRUNCHROSE card. Tap to enlarge.</p>`;

let occ='all';
const home=()=>`<div class="ivory"><div class="wrap hero"><div><h1>Not just a scrunchie. A little piece of love.</h1><p>Flowers fade. Feelings stay. Discover scrunchies folded into roses, wrapped in stories, and made to be kept close.</p><div class="cta"><a class="btn" href="#/" data-s="shop">Shop the collection</a><a class="btn ghost" href="#/" data-s="story">Discover our story</a></div></div><div class="frame"><img width="500" height="404" src="${IMG.rosewine}" alt="Burgundy velvet scrunchie folded into a rose"></div></div></div>
<section class="cream" id="shop"><div class="wrap"><h2>Flowers you can wear</h2><p class="sub">A little bloom for every kind of feeling.</p><div class="feel" id="feel" role="group" aria-label="Shop by occasion">${OCC.map(([k,l])=>`<button data-o="${k}" aria-pressed="${k===occ}">${l}</button>`).join('')}</div><div class="grid">${P.filter(p=>occ==='all'||p.occ.includes(occ)).map(prodCard).join('')}</div><p class="note">Sample catalogue: ${fmt(CONFIG.price)} development pricing; stock and fabric to be confirmed. Colours are visual references.</p></div></section>
<section class="blush" id="packaging"><div class="wrap two"><div><h2>Not wrapped. Remembered.</h2><p class="sub">To the softest part of your story.</p><p>Each scrunchie is folded into a rose, tied with a ribbon to a botanical letter card, and meant to be untied and worn. The printed stems and leaves belong to the card, not the scrunchie.</p><p>Slip off the ribbon and the rose becomes a full-size scrunchie.</p></div><div style="max-width:420px;margin:auto">${cardFig()}</div></div></section>
<section class="wine"><div class="wrap" style="text-align:center"><h2 style="max-width:14ch;margin:auto">Love lives in the little things.</h2><p style="max-width:44ch;margin:20px auto 0">A borrowed sweater, a quiet morning, a colour someone remembered you like.</p></div></section>
<section class="ivory" id="making"><div class="wrap"><h2>From scrunchie to rose</h2><ol class="steps"><li><h3>Choose the colour</h3><p>We begin with a scrunchie in a colour that tells its own story.</p></li><li><h3>Arrange it into a rose</h3><p>The fabric is gently folded into a rose-inspired bloom.</p></li><li><h3>Secure it with ribbon</h3><p>A soft ribbon holds the shape and makes it gift-ready.</p></li><li><h3>Attach the letter</h3><p>The bloom is paired with its botanical card.</p></li></ol><p class="note">Confirm and describe the real sourcing (for example, ready-made scrunchies folded by hand) before launch.</p></div></section>
<section class="sage" id="story"><div class="wrap" style="max-width:700px"><h2>A little love, from Akrita.</h2><br><p>SCRUNCHROSE began with a simple thought: what if an everyday little thing could feel like receiving a flower?</p><p>Every scrunchie is presented as a little bloom, accompanied by a letter designed to make an ordinary accessory feel thoughtful and personal.</p><p>Because love doesn't always need a grand gesture. Sometimes, it is a little ribbon, a favourite colour, or something chosen just for you.</p><p>With love,</p><p class="sig">Akrita Kaur</p><p>Founder, SCRUNCHROSE</p><p class="note">Proposed copy, editable.</p></div></section>
<section class="cream"><div class="wrap" style="max-width:640px"><h2>Letters from the garden</h2><p class="sub">New blooms and little love notes.</p><form class="f" id="nl" novalidate><div class="w"><label for="em">Email</label><input id="em" type="email" autocomplete="email"><div class="err" id="ne" role="alert"></div></div><button class="btn w">Subscribe</button></form><p class="note">Not connected: no addresses are stored until a mailing service or backend is added.</p></div></section>`;
const product=id=>{const p=pr(id);if(!p)return `<section class="ivory"><div class="wrap"><h2>Not found</h2><p><a href="#/">Back to the collection</a></p></div></section>`;let q=1;
return `<section class="ivory"><div class="wrap"><p><a href="#/" data-s="shop">← All blooms</a></p><div class="two" style="align-items:start"><div><div class="frame"><img width="500" height="404" src="${p.img}" alt="${p.name} velvet scrunchie"></div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px"><button class="zoom" data-zoom><div class="frame"><img loading="lazy" src="${CARD}" alt="Packaging concept card, front and back"></div></button></div></div>
<div><h1 style="font-size:clamp(2.4rem,5vw,4rem)">${p.name}</h1><p class="sub" style="margin:8px 0">${fmt(p.price)} · <span class="dot" style="background:${p.hex}"></span> ${p.name}</p><p class="note">${p.stock}</p><p>${p.d}</p>
<div class="row" style="justify-content:flex-start;gap:16px"><span class="q"><button id="qm" aria-label="Decrease quantity">−</button> <strong id="qv">1</strong> <button id="qp" aria-label="Increase quantity">+</button></span></div>
<div class="act" style="max-width:420px"><button class="p" id="ad">Add to cart</button><button id="bn">Buy now</button></div>
<h3 style="margin-top:34px">Care</h3><p>Hand wash gently in cool water. Do not wring. Air dry flat. Keep away from direct heat. <span class="note">(From the packaging concept; verify before launch.)</span></p>
<h3 style="margin-top:20px">Delivery and returns</h3><p>Standard delivery is ${fmt(CONFIG.delivery)} per order. Delivery times and the returns policy are to be confirmed (see <a href="#/info">Help</a>).</p></div></div></div></section>
<section class="blush"><div class="wrap two"><div><h2>The packaging</h2><p class="sub">A letter to keep.</p><p>Your scrunchie arrives folded into a rose on a botanical card with a ribbon. Untie the ribbon to wear it.</p></div><div style="max-width:380px;margin:auto">${cardFig()}</div></div></section>
<section class="cream"><div class="wrap"><h2>More blooms</h2><br><div class="grid">${P.filter(x=>x.id!==id).slice(0,3).map(prodCard).join('')}</div></div></section>`};
const FIELDS=[['name','Full name','text',1],['email','Email','email',1],['phone','Phone number','tel',1],['flat','House or flat number','text',1],['street','Street and area','text',1,1],['landmark','Landmark (optional)','text',0],['city','City','text',1],['state','State','text',1],['pin','PIN code','text',1],['country','Country','text',1]];
const V={email:v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)||'Enter a valid email, like you@example.com.',phone:v=>/^(\+91[\s-]?)?[6-9]\d{9}$/.test(v.replace(/\s/g,''))||'Enter a 10-digit Indian mobile number.',pin:v=>/^[1-9]\d{5}$/.test(v)||'Enter a 6-digit PIN code.'};
let form={country:'India'};
const checkout=()=>{if(!cart.length)return `<section class="ivory"><div class="wrap" style="text-align:center"><h2>Your bag is empty</h2><p class="sub">Choose a bloom to begin.</p><a class="btn" href="#/" data-s="shop">Shop now</a></div></section>`;
return `<section class="ivory"><div class="wrap two" style="align-items:start"><form class="f" id="co" novalidate><h2 class="w">Checkout</h2>${FIELDS.map(([k,l,t,r,w])=>`<div class="${w?'w':''}"><label for="f-${k}">${l}</label><input id="f-${k}" name="${k}" type="${t}" value="${(form[k]||'').replace(/"/g,'&quot;')}" ${r?'required':''}><div class="err" id="e-${k}" role="alert"></div></div>`).join('')}<div class="w sum"><strong>Payment</strong><p class="note">Online payment is not connected yet. UPI, card and cash on delivery need a payment provider and a backend, so no payment can be taken here.</p></div><button class="btn w">Review order (demo)</button></form>
<div class="sum"><h3>Order summary</h3>${cart.map(x=>{const p=pr(x.id);return `<div class="tot"><span>${p.name} × ${x.q}</span><span>${fmt(p.price*x.q)}</span></div>`}).join('')}<hr>${totals()}</div></div></section>`};
const info=()=>`<section class="ivory"><div class="wrap" style="max-width:720px"><h2>Help and policies</h2><p class="note">Editable templates. Replace with confirmed business terms before launch.</p>${[['Shipping',`Standard delivery is ${fmt(CONFIG.delivery)} per order. Delivery timelines: to be confirmed.`],['Returns and refunds','Policy to be written and confirmed by the owner.'],['Privacy','Describe what data is collected and how it is used once a backend exists.'],['Terms','Terms and conditions to be added.'],['Contact','Add support email and Instagram link.'],['FAQ','Is this a real order? Not yet: checkout is a demo until payments are connected.']].map(([a,b])=>`<h3 style="margin-top:28px">${a}</h3><p>${b}</p>`).join('')}</div></section>`;
function route(){const h=location.hash||'#/',a=$('#app');
if(h.startsWith('#/product/'))a.innerHTML=product(h.slice(10));else if(h.startsWith('#/checkout'))a.innerHTML=checkout();else if(h.startsWith('#/info'))a.innerHTML=info();else if(h.startsWith('#/done'))a.innerHTML=`<section class="ivory"><div class="wrap" style="max-width:640px"><h2>Order not placed</h2><p>Your details look valid, but this is a demo: no order was created and no payment was taken. Once a backend and payment provider are connected, this step will create the order and confirm it only after payment is verified.</p><a class="btn" href="#/">Back to the collection</a></div></section>`;else a.innerHTML=home();
zoomable();if(!h.startsWith('#/checkout')&&!h.startsWith('#/')||h==='#/'||h.startsWith('#/product')){}
if(h.startsWith('#/product/')){let q=1;const s=()=>$('#qv').textContent=q;$('#qm').onclick=()=>{q=Math.max(1,q-1);s()};$('#qp').onclick=()=>{q++;s()};const id=h.slice(10);$('#ad').onclick=()=>add(id,q);$('#bn').onclick=()=>{add(id,q,false);location.hash='#/checkout'}}
if($('#co'))$('#co').onsubmit=e=>{e.preventDefault();let ok=1;FIELDS.forEach(([k,,,r])=>{const el=$('#f-'+k);form[k]=el.value.trim();let m='';if(r&&!form[k])m='This field is required.';else if(V[k]&&form[k]&&V[k](form[k])!==true)m=V[k](form[k]);$('#e-'+k).textContent=m;el.setAttribute('aria-invalid',!!m);if(m)ok=0});if(ok)location.hash='#/done'};
if($('#nl'))$('#nl').onsubmit=e=>{e.preventDefault();$('#ne').textContent=V.email($('#em').value.trim())===true?'Looks good. Subscriptions are not stored until a service is connected.':'Enter a valid email, like you@example.com.'};
if($('#feel'))$('#feel').onclick=e=>{const b=e.target.closest('[data-o]');if(b){occ=b.dataset.o;route();$('#shop').scrollIntoView()}};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
}
addEventListener('hashchange',()=>{route();if(!pendingS)scrollTo(0,0);pendingS=0});
let pendingS=0;document.addEventListener('click',e=>{const a=e.target.closest('[data-s]');if(!a)return;const id=a.dataset.s;pendingS=1;setTimeout(()=>{pendingS=0;const t=document.getElementById(id);if(t)t.scrollIntoView()},60);closeD()});
paint();route();
/* ---- intro ---- */
(function(){const I=$('#intro'),cv=$('#cv'),T=[...$('#itext').children];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;let seen=0;try{seen=sessionStorage.getItem('sr-intro')}catch(e){}
if(reduce||seen){I.remove();return}
document.body.style.overflow='hidden';let done=0,raf,timers=[];
let R,sc,cam,rose,bits=[],t0=performance.now(),burst=0;
try{
R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.5));
sc=new THREE.Scene();cam=new THREE.PerspectiveCamera(38,1,.1,50);cam.position.set(0,2.6,7.2);cam.lookAt(0,.9,0);
sc.add(new THREE.AmbientLight(0xffd9d9,.45));const k=new THREE.DirectionalLight(0xfff0e0,1.5);k.position.set(3,6,5);sc.add(k);const r=new THREE.PointLight(0xd9a5a8,1.2,14);r.position.set(-3,2,3);sc.add(r);
const cols=[0x2e0a16,0x401321,0x4f1829,0x5c1a30,0x6E1F3A,0x7d2a46];
function pg(w,h,c){const g=new THREE.PlaneGeometry(w,h,8,8),p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),t=(p.getY(i)+h/2)/h;p.setX(i,x*(.5+.75*Math.sin(Math.min(1,t*1.15)*2.6+.2)));p.setZ(i,-Math.pow(x/w*2,2)*.3*w-t*t*c*h);p.setY(i,t*h)}g.computeVertexNormals();return g}
rose=new THREE.Group();const L=[];
for(let l=0;l<6;l++){const n=l<1?3:3+l,w=.8+l*.2,h=1.1+l*.22;const g=pg(w,h,.35-l*.03);const m=new THREE.MeshStandardMaterial({color:cols[l],roughness:.55,metalness:.05,side:THREE.DoubleSide});
for(let i=0;i<n;i++){const y=new THREE.Group(),t=new THREE.Group();y.rotation.y=i*2*Math.PI/n+l*.7;t.position.z=.08+l*.16;const me=new THREE.Mesh(g,m);t.add(me);y.add(t);y.position.y=l*.02;rose.add(y);L.push({t,l})}}
rose.scale.setScalar(.01);sc.add(rose);
const pgm=pg(.22,.3,.5),pm=[0x6E1F3A,0x401321,0xD9A5A8].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.6,side:THREE.DoubleSide}));
const N=innerWidth<700?30:55;for(let i=0;i<N;i++){const m=new THREE.Mesh(pgm,pm[i%3]);m.position.set((Math.random()-.5)*9,Math.random()*7-1,(Math.random()-.5)*6+1);m.userData={s:.2+Math.random()*.4,sp:Math.random()*2,v:null};m.scale.setScalar(.6+Math.random());sc.add(m);bits.push(m)}
rose.userData.L=L;
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.position.z=w<700?9.5:7.2;cam.updateProjectionMatrix()}size();addEventListener('resize',size);
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
(function loop(){raf=requestAnimationFrame(loop);const t=(performance.now()-t0)/1000;
const grow=ease(t/1.8),bl=ease((t-.8)/3.6),fade=burst?1-ease((t-burst)/.9):1;
rose.scale.setScalar(Math.max(.001,(.5+.5*grow)*fade*1.15));rose.rotation.y=t*.25;rose.position.y=-.2;
rose.userData.L.forEach(o=>{o.t.rotation.x=.12+bl*(.25+o.l*.2)});
cam.position.x=Math.sin(t*.25)*.8;cam.lookAt(0,.9,0);
bits.forEach(m=>{const u=m.userData;if(burst&&!u.v){u.v=new THREE.Vector3(m.position.x*.6+(Math.random()-.5),.3+Math.random()*.6,(Math.random()-.2)*2).multiplyScalar(1.2)}
if(u.v){m.position.addScaledVector(u.v,.03)}else{m.position.y-=u.s*.012;if(m.position.y<-3)m.position.y=5;m.position.z+=u.sp*.002}
m.rotation.x+=.02*u.sp;m.rotation.z+=.015});
R.render(sc,cam)})();
}catch(e){cv.remove();R=null}
function fin(){if(done)return;done=1;timers.forEach(clearTimeout);cancelAnimationFrame(raf);I.classList.add('hide');document.body.style.overflow='';try{sessionStorage.setItem('sr-intro',1)}catch(e){}
setTimeout(()=>{if(R){sc.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()});R.dispose()}I.remove()},1200)}
$('#skip').onclick=fin;
const at=(ms,f)=>timers.push(setTimeout(f,ms));
at(2600,()=>{T[0].classList.add('on')});at(3900,()=>T[1].classList.add('on'));at(4900,()=>T[2].classList.add('on'));
at(6400,()=>{burst=(performance.now()-t0)/1000;T.forEach(x=>x.classList.remove('on'))});at(7600,fin);
})();
</script></body></html>
